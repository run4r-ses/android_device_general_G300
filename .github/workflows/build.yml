name: Build TWRP

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Recovery
    runs-on: ubuntu-22.04

    steps:
      - name: Free disk space
        run: |
          mkdir -p /tmp/empty
          for dir in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache; do
            if [ -d "$dir" ]; then
              sudo rsync -a --delete /tmp/empty/ "$dir"/ 2>/dev/null || true
              sudo rm -rf "$dir"
            fi
          done
          rm -rf /tmp/empty

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf \
            imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3 python-is-python3 libtinfo5

      - name: Install Repo
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          sudo ln -sf ~/.bin/repo /usr/local/bin/repo
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Sync TWRP sources
        run: |
          mkdir -p twrp
          cd twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: twrp/device/general/G300

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: twrp-G300-ccache
          max-size: 10G

      - name: Build image
        run: |
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          export CCACHE_DIR="${HOME}/.cache/ccache"
          ccache -M 10G
          cd twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch twrp_G300-eng
          mka bootimage -j$(nproc --all)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-G300-boot.img
          path: twrp/out/target/product/G300/boot.img
